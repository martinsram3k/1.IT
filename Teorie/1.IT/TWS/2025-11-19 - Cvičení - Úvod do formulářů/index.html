<!DOCTYPE html>
<html lang="cs">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Základní formulář pro test</title>
    </head>
    <body>

        <h2>Pizzerie it2029 - Objednávka</h2>
        <hr>

        <form method="post" action="#">

            <label for="jmeno">Jméno: </label><input required type="text"
                id="jmeno" name="jmeno" placeholder="Vaše jméno">
            <br>
            <label for="email">E-mail: </label><input type="email" id="email"
                name="email" placeholder="Váš e-mail">
            <br>
            <br>
            <hr>

            <h3>Velikost pizzy</h3>
            <label for="mala">Malá</label><input id="mala" type="radio"
                name="velikost" value="mala">
            <label for="velka">Velká</label><input id="velka" type="radio"
                name="velikost" value="velka" checked>
            <br>
            <hr>

            <h3>Platba a Přísady</h3>

            <label for="karta">Platba kartou</label><input type="checkbox"
                id="karta" name="platba" value="karta" checked>
            <br>

            <label for="prisady_select">Přísada:</label>
            <select name="prisady" id="prisady_select">
                <option value="syr">Sýr</option>
                <option value="salami">Salám</option>
                <option value="zelenina">Kukuřice</option>
            </select>
            <br>
            <br>
            <hr>

            <input type="submit" value="Odeslat objednávku">
            <hr>
            <h3>vymazat formular</h3>
            <input type="reset" value="Vymazat formulář">
<hr>
<h3>Dalsi vstupy formulare</h3>
<input type="file" name="datum" id="datum"><br>
<input type="password" name="datum" id="datum"><br>
<input type="number" name="datum" id="datum"><br>
<input type="date" name="datum" id="datum"><br>
<input type="month" name="datum" id="datum"><br>
<input type="color" name="datum" id="datum"><br>
        </form>

    </body>
</html>
