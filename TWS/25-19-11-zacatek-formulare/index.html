<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formuláře</title>
    </head>
    <body>

        <h2>Pizzerie it2029 - sluníčka</h2>

        <form  method="post">

            <label for="jmeno">Jméno: </label>
            <input required type="text" id="jmeno" name="jmeno" placeholder="Vaše jméno">
            <br>
            <label for="email">E-mail: </label>
            <input type="email" id="email" name="email" placeholder="Váš e-mail">
            <br>
            <br>
            <br>

            <label for="mala">mala</label>
            <input id="mala" type="radio" name="velikost" >
            <br>
            <label for="velka">velka</label>
            <input id="velka" type="radio" name="velikost" checked>
            <br>
            <input type="submit" value="Odeslat objednávku">

        </form>

    </body>
</html>
