<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sportovní týmy</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h2>Tabulka sportovních týmů</h2>

        <table border="1px" cell style="
width: 70%;
margin: auto;
">
            <tr>
                <th>Název týmu</th>
                <th>Země</th>
                <th>Logo</th>
            </tr>

            <tr height="60px"> >
                <td colspan="3">Fotbal</td>
            </tr>

            <tr>
                <th>AC Sparta Praha</th>
                <th rowspan="2">Česko</th>
                <th><img width="300px" style="margin: auto;" src="img/sparta.png" alt></th>
            </tr>

            <tr>
                <th>FC Slovan Liberec</th>
                <th><img width="300px" style="margin: auto;" src="img/liberec.png" alt></th>
            </tr>

             <tr height="60px"> >
                <td colspan="3">Hokej</td>
            </tr>

            
            <tr>
                <th>Calgary Flames</th>
                <th>Kanada</th>
                <th><img width="300px" style="margin: auto;" src="img/calgary.svg" alt></th>
            </tr>

            
            <tr>
                <th>Boston bruises</th>
                <th>USA</th>
                <th><img width="300px" style="margin: auto;" src="img/boston.png" alt></th>
            </tr>
        </table>

    </body>
</html>
