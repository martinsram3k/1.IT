<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LEGO formulář</title>
    </head>
    <body>

        <h1>LEGO formulář</h1>

        <form action="#" method="post">
            <input type="text" placeholder="Uživatelské Jméno" required >

            <br>
            <br>

            <label for="email">Email:</label>
            <input id="email" type="email" required >

            <br>
            <br>

            <label for="Heslo">Heslo:</label>
            <input id="Heslo" type="password" required >

            <br>
            <br>

            <label for="oblibene">Oblíbená lego stavebnice:</label>
            <select id="oblibene">
                <option>LEGO City</option>
                <option>LEGO Technic</option>
                <option >LEGO Harry Potter</option>
                <option>LEGO Freinds</option>
            </select>

            <br>
            <br>

            <label for="pohlavi">Pohlaví:</label>
            <input id="muz" type="radio" name="pohlavi" value="muz">
            <label for="muz">Muž</label>
            <input id="zena" type="radio" name="pohlavi" value="zena">
            <label for="zena">Žena</label>

            <br>
            <br>

            <label for="newsletter">Chcete dostávat LEGO novinky?</label>
            <input id="newsletter" type="checkbox">

            <br>
            <br>

            <button type="reset">Obnovit</button>
            <button type="submit">Budiž</button>


        </form>

    </body>
</html>
